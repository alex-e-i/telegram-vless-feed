name: Collect and verify Telegram VPN
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          URL=$(echo "$RELEASE" | python -c 'import json,sys; a=json.load(sys.stdin)["assets"]; print(next(x["browser_download_url"] for x in a if x["name"].endswith("linux-amd64.tar.gz") and "legacy" not in x["name"]))')
          curl -fsSL "$URL" -o /tmp/sing-box.tar.gz
          mkdir -p /tmp/singbox
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/singbox
          sudo install -m 755 "$(find /tmp/singbox -type f -name sing-box | head -n1)" /usr/local/bin/sing-box
          sing-box version
      - name: Collect and verify through real VPN tunnel
        run: python collect.py --verify --timeout 10 --workers 8
      - name: Publish subscription and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subs.txt report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Telegram VPN subscription'
            git push
          fi
